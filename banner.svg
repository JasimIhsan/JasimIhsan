<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Google Font Imports -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap');
      
      .text-name {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        fill: url(#textGrad);
      }
      
      .text-title {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        fill: #14B8A6;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Soft Glow Backdrop (Eclipse Effect) -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Glowing Ambient Spotlight -->
  <circle cx="400" cy="125" r="220" fill="url(#ambientGlow)" />

  <!-- Center Content -->
  <g text-anchor="middle">
    <!-- Subtitle Label -->
    <text x="400" y="95" class="text-title" font-size="13" letter-spacing="4">SOFTWARE DEVELOPMENT ENGINEER</text>
    
    <!-- Main Name -->
    <text x="400" y="148" class="text-name" font-size="46" letter-spacing="4">JASIM IHSAN</text>
    
    <!-- Ultra-Minimalist Accent Divider -->
    <rect x="360" y="172" width="80" height="2" rx="1" fill="url(#accentGrad)" />

    <!-- Core areas listed minimally -->
    <text x="400" y="202" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#64748B" font-weight="400" letter-spacing="2">
      FULL-STACK &amp; MOBILE • SCALABLE BACKENDS • DEVOPS
    </text>
  </g>
</svg>
