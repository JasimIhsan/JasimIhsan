<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F72AF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#9b5de5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE2EF"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#glowCyan)"/>
  <rect width="100%" height="100%" fill="url(#glowPurple)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Decorative Circuit lines / Tech shapes -->
  <g opacity="0.25">
    <path d="M-50,150 Q100,50 300,180 T700,50 T900,200" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 4"/>
    <path d="M-50,180 Q120,80 320,200 T720,80 T900,230" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.5"/>
    <circle cx="300" cy="180" r="4" fill="#00F2FE" />
    <circle cx="700" cy="50" r="4" fill="#9b5de5" />
    <circle cx="120" cy="80" r="3" fill="#3F72AF" />
    <circle cx="500" cy="120" r="2.5" fill="#FFF" opacity="0.8"/>
    <circle cx="200" cy="220" r="1.5" fill="#FFF" opacity="0.5"/>
    <circle cx="650" cy="250" r="2" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(400, 140)" text-anchor="middle">
    <!-- Main Name -->
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="url(#textGrad)" y="-15">
      JASIM IHSAN
    </text>
    
    <!-- Accent Line -->
    <rect x="-180" y="10" width="360" height="3" rx="1.5" fill="url(#accentGrad)"/>
    
    <!-- Subtitle -->
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3" fill="#00F2FE" y="42">
      FOUNDING ENGINEER • FULL-STACK DEVELOPER
    </text>
    
    <!-- Secondary Subtitle / Tags -->
    <text font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="2" fill="#DBE2EF" opacity="0.8" y="70">
      MERN STACK &amp; FLUTTER SPECIALIST
    </text>
  </g>
</svg>
